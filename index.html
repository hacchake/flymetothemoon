<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FLY ME TO THE MOON</title>
<meta name="description" content="FlyWire の配線を素材にした小さな脳が、光に向かって歩く。">
<style>
  :root {
    --bg: #02030a;
    --ink: #d9def5;
    --dim: rgba(217, 222, 245, 0.55);
    --line: rgba(150, 170, 230, 0.18);
    --moon: #fff4d6;
    --good: #9df5b4;
    --bad: #ff8a8a;
    --panel: 380px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", system-ui, sans-serif; overflow: hidden; }
  #app { display: grid; grid-template-columns: 1fr var(--panel); height: 100%; }
  body.no-brain #app { grid-template-columns: 1fr 0; }
  body.no-brain #brain-wrap { display: none; }
  #world-wrap { position: relative; min-width: 0; }
  #world { display: block; cursor: crosshair; touch-action: none; }
  #brain-wrap { position: relative; border-left: 1px solid var(--line); background: rgba(5, 8, 22, 0.9); }
  #brain { display: block; }
  #brain-title { position: absolute; top: 10px; left: 16px; font-size: 11px; letter-spacing: 0.18em; color: var(--dim); pointer-events: none; }

  header { position: absolute; top: 18px; left: 22px; pointer-events: none; }
  h1 { margin: 0; font-weight: 300; font-size: clamp(18px, 2.6vw, 30px); letter-spacing: 0.42em; color: var(--moon);
    text-shadow: 0 0 18px rgba(255, 244, 214, 0.35); }
  .sub { margin-top: 6px; font-size: 11px; letter-spacing: 0.12em; color: var(--dim); }

  #stats { position: absolute; top: 18px; right: 20px; text-align: right; font-size: 12px; color: var(--dim); pointer-events: none;
    display: grid; grid-template-columns: auto auto; gap: 2px 12px; }
  #stats b { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }
  #stats .big b { font-size: 20px; color: var(--moon); }
  #energy-box { grid-column: 1 / 3; margin-top: 6px; width: 180px; justify-self: end; height: 4px; background: rgba(255,255,255,0.1); }
  #energy { height: 100%; width: 100%; background: var(--good); transition: width 0.2s; }
  #energy.low { background: var(--bad); }

  #msgs { position: absolute; top: 40%; left: 0; right: 0; text-align: center; pointer-events: none; }
  .msg { font-size: 15px; letter-spacing: 0.15em; margin: 4px; }
  .msg.good { color: var(--good); } .msg.bad { color: var(--bad); } .msg.moon { color: var(--moon); font-size: 20px; }

  footer { position: absolute; left: 0; right: 0; bottom: 14px; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
  #tools { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; pointer-events: auto; padding: 0 12px; }
  button { background: rgba(20, 26, 55, 0.75); color: var(--ink); border: 1px solid var(--line); border-radius: 999px;
    padding: 7px 14px; font: inherit; font-size: 12px; letter-spacing: 0.08em; cursor: pointer; }
  button:hover { border-color: rgba(200, 210, 255, 0.5); }
  button.on { background: rgba(255, 244, 214, 0.16); border-color: var(--moon); color: var(--moon); }
  button kbd { opacity: 0.5; font-family: inherit; margin-right: 4px; }
  #hint { font-size: 11px; color: var(--dim); letter-spacing: 0.1em; }
  #question { position: absolute; left: 22px; bottom: 16px; font-size: 11px; color: rgba(217,222,245,0.35); letter-spacing: 0.1em; pointer-events: none; max-width: 30ch; line-height: 1.6; }
  #debug { position: absolute; left: 22px; top: 80px; font: 11px/1.5 ui-monospace, monospace; color: var(--dim); white-space: pre; pointer-events: none; }
  .hidden { display: none; }

  @media (max-width: 860px) {
    #app { grid-template-columns: 1fr; grid-template-rows: 1fr 0; }
    body:not(.no-brain) #app { grid-template-rows: 58% 42%; }
    #brain-wrap { border-left: 0; border-top: 1px solid var(--line); }
    #question { display: none; }
    #stats { top: 64px; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="world-wrap">
    <canvas id="world"></canvas>
    <header>
      <h1>FLY ME TO THE MOON</h1>
      <div class="sub">FlyWire の配線からできた小さな脳が、光を見て歩く</div>
    </header>
    <div id="stats">
      <span class="big">SCORE</span><span class="big"><b id="score">0</b></span>
      <span>月までの距離</span><span><b id="dist">0</b> px</span>
      <span>生存時間</span><span><b id="time">0</b> 秒</span>
      <span>試行</span><span><b id="trials">1</b></span>
      <span>月に届いた回数</span><span><b id="landings">0</b></span>
      <div id="energy-box"><div id="energy"></div></div>
    </div>
    <div id="msgs"></div>
    <div id="debug" class="hidden"></div>
    <div id="question">このハエの中に「月」はない。<br>あるのは光と、神経の発火と、脚の動きだけ。</div>
    <footer>
      <div id="tools">
        <button data-mode="lamp"><kbd>1</kbd>光</button>
        <button data-mode="moon"><kbd>2</kbd>月</button>
        <button data-mode="food"><kbd>3</kbd>餌</button>
        <button data-mode="rock"><kbd>4</kbd>岩</button>
        <button id="btn-pause">一時停止</button>
        <button id="btn-reset">やり直す</button>
        <button id="btn-brain">脳</button>
      </div>
      <div id="hint"></div>
    </footer>
  </div>
  <div id="brain-wrap">
    <canvas id="brain"></canvas>
    <div id="brain-title">BRAIN — 左半球 ｜ 右半球</div>
  </div>
</div>
<script src="src/circuit.js"></script>
<script src="src/brain.js"></script>
<script src="src/interface.js"></script>
<script src="src/world.js"></script>
<script src="src/game.js"></script>
<script src="src/render.js"></script>
<script src="src/main.js"></script>
</body>
</html>
