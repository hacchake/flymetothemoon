<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FMTTM Lesion Tests</title>
<style>
  :root { --bg: #05070f; --ink: #d9def5; --dim: #8a91b0; --ok: #9df5b4; --ng: #ff8a8a; --line: #1e2440; }
  body { margin: 0; padding: 24px 16px; background: var(--bg); color: var(--ink); font: 14px/1.6 system-ui, "Yu Gothic UI", sans-serif; }
  main { max-width: 860px; margin: 0 auto; }
  h1 { font-weight: 300; letter-spacing: 0.2em; font-size: 20px; }
  p { color: var(--dim); }
  table { width: 100%; border-collapse: collapse; margin-top: 16px; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--dim); font-weight: 500; }
  .ok { color: var(--ok); } .ng { color: var(--ng); }
  .wrap { overflow-x: auto; }
</style>
</head>
<body>
<main>
  <h1>LESION TESTS</h1>
  <p>画面を使わずに同じ閉ループ（感覚 → 回路 → DN → 身体 → 世界）を回し、回路の一部を切ったときに行動が変わるかを確かめる。
     「無傷」が「損傷」より明らかに良ければ、その行動はそこの神経経路を通って生まれている。</p>
  <div class="wrap">
  <table>
    <thead><tr><th>課題</th><th>無傷</th><th>損傷</th><th>切った経路</th><th>判定</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  </div>
  <p id="status">実行中…</p>
</main>
<script src="src/circuit.js"></script>
<script src="src/brain.js"></script>
<script src="src/interface.js"></script>
<script src="src/world.js"></script>
<script src="src/main.js"></script>
<script>
(function () {
  const SEEDS = [1, 2, 3, 4, 5, 6];
  const food = [
    (w) => { w.moon.I = 0; w.foods.push({ x: 400, y: 250 }); w.fly.h = 0; },
    (w) => { w.moon.I = 0; w.foods.push({ x: 300, y: 560 }); w.fly.h = -Math.PI / 2; },
    (w) => { w.moon.I = 0; w.foods.push({ x: 650, y: 120 }); w.fly.h = Math.PI / 2; },
  ];
  const rocks = (w) => { w.rocks.push({ x: 420, y: 300, r: 34 }, { x: 560, y: 230, r: 26 }, { x: 300, y: 380, r: 22 }); };
  const TESTS = [
    { name: "月（左前方）に届く", setups: [null], metric: "reached", lesionName: "視覚投射（側方）→ DNa02/01",
      lesion: (p) => p.from.startsWith("VPNl") },
    { name: "月（真後ろ）に届く", setups: [(w) => { w.fly.h = Math.PI; }], metric: "reached", lesionName: "視覚投射（側方）→ DNa02/01",
      lesion: (p) => p.from.startsWith("VPNl") },
    { name: "餌の匂いをたどる", setups: food, metric: "eaten", lesionName: "側角 → DN",
      lesion: (p) => p.from.startsWith("LHN_") },
    { name: "岩を避ける（衝突の少なさ）", setups: [rocks], metric: "hits", lesionName: "LPLC2 → GF/DNa02/MDN",
      lesion: (p) => p.from.startsWith("LPLC2") },
  ];

  function measure(t, lesion) {
    let good = 0, n = 0, hits = 0;
    for (const setup of t.setups) for (const seed of SEEDS) {
      const r = FM.experiment({ seconds: 30, seed, setup, lesion });
      n++; hits += r.hits;
      if (t.metric === "reached" && r.reached) good++;
      if (t.metric === "eaten" && r.eaten > 0) good++;
    }
    return t.metric === "hits" ? { text: `衝突 ${hits} 回 / ${n} 試行`, value: -hits } : { text: `${good} / ${n}`, value: good / n };
  }

  const rows = document.getElementById("rows");
  let i = 0;
  function next() {
    if (i >= TESTS.length) { document.getElementById("status").textContent = "完了。シードは固定なので、同じ結果が再現される。"; return; }
    const t = TESTS[i++];
    const a = measure(t, null), b = measure(t, t.lesion);
    const ok = a.value > b.value;
    rows.insertAdjacentHTML("beforeend",
      `<tr><td>${t.name}</td><td>${a.text}</td><td>${b.text}</td><td>${t.lesionName}</td><td class="${ok ? "ok" : "ng"}">${ok ? "経路が効いている" : "差なし"}</td></tr>`);
    setTimeout(next, 0);
  }
  window.addEventListener("load", () => setTimeout(next, 50));
})();
</script>
</body>
</html>
